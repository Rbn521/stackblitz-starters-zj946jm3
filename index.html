<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dream Team [ PSG ]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2145; --navy2:#132F5E; --red:#DA291C; --paper:#F2F4F9; --ink:#10213F;
  --grass:#2F7F4F; --grass2:#378B58; --wood:#8A5A2B; --wood2:#6B4220; --gold:#E2B84A;
  --display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--navy);color:var(--paper);min-height:100vh;font-size:16px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{position:sticky;top:0;z-index:20;background:var(--navy);border-bottom:4px solid var(--red);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:.02em}
.brand span{color:var(--red)}
.wallet{font-family:var(--display);font-weight:700;font-size:1.6rem;background:var(--paper);color:var(--navy);padding:2px 16px;border-radius:999px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 18px;background:var(--navy2)}
nav button{background:transparent;color:var(--paper);border:2px solid transparent;border-radius:8px;padding:7px 14px;font-weight:600;font-size:.95rem}
nav button:hover{border-color:var(--paper)}
nav button.on{background:var(--red);border-color:var(--red)}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h2{font-family:var(--display);font-size:2rem;font-weight:800;margin-bottom:4px}
.sub{opacity:.8;margin-bottom:18px;max-width:60ch}
.panel{background:var(--navy2);border-radius:14px;padding:20px;margin-bottom:18px}
.btn{background:var(--red);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:600;font-size:1rem}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:var(--paper);color:var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Base */
.signwrap{display:flex;justify-content:center;margin-bottom:-14px;position:relative;z-index:2}
.sign{background:linear-gradient(var(--wood),var(--wood2));border:4px solid #4d2f14;border-radius:8px;padding:8px 26px;font-family:var(--display);font-weight:800;font-size:1.7rem;color:#FBE9CC;text-shadow:0 2px 0 #3a2210;position:relative}
.sign::before,.sign::after{content:"";position:absolute;bottom:-26px;width:10px;height:26px;background:#4d2f14}
.sign::before{left:22%}.sign::after{right:22%}
.stadium{background:repeating-linear-gradient(90deg,var(--red) 0 22px,var(--paper) 22px 44px);padding:16px;border-radius:18px}
.stands{background:var(--navy2);border-radius:12px;padding:14px}
.pitch{background:repeating-linear-gradient(0deg,var(--grass) 0 46px,var(--grass2) 46px 92px);border:3px solid #fff;border-radius:8px;padding:20px 8px;display:flex;flex-direction:column;gap:16px;position:relative}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border:3px solid rgba(255,255,255,.55);border-radius:50%;pointer-events:none}
.line{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;position:relative;z-index:1}
.slot{width:96px;height:136px;border:2px dashed rgba(255,255,255,.7);border-radius:10px;display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:.8rem;text-align:center;padding:6px;background:rgba(0,0,0,.12)}

/* Cartes */
.card,.card-back,.card-lock{--shape:polygon(9% 0,91% 0,100% 8%,100% 85%,50% 100%,0 85%,0 8%)}
.card{--c1:#9FB1C7;--c2:#5E738D;--ink:#0b1830;--t1:#fff;--t2:#8EA2BC;--line:rgba(0,0,0,.3);width:124px;height:176px;position:relative;color:var(--ink);flex:none;user-select:none;filter:drop-shadow(0 5px 6px rgba(0,0,0,.5))}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,var(--t1),var(--t2));clip-path:var(--shape)}
.card::after{content:"";position:absolute;inset:3px;background:radial-gradient(90% 55% at 50% 0%,rgba(255,255,255,.45),transparent 70%),repeating-linear-gradient(120deg,rgba(255,255,255,.07) 0 8px,transparent 8px 16px),linear-gradient(165deg,var(--c1),var(--c2));clip-path:var(--shape)}
.card.bronze{--c1:#E2A56B;--c2:#8E5A2A;--ink:#2B1606;--t1:#F3C896;--t2:#7A4A1E;--line:rgba(43,22,6,.35)}
.card.argent{--c1:#F4F6FA;--c2:#9AA9BD;--ink:#14233E;--t1:#fff;--t2:#7F8EA3;--line:rgba(20,35,62,.3)}
.card.or{--c1:#FBE38C;--c2:#C39328;--ink:#3B2A04;--t1:#FFF4C2;--t2:#9A6F12;--line:rgba(59,42,4,.35)}
.card.elite{--c1:#7FE3FF;--c2:#2B5FD9;--ink:#04122E;--t1:#E6FBFF;--t2:#3A6FE0;--line:rgba(4,18,46,.4)}
.c-fx{position:absolute;inset:3px;clip-path:var(--shape);overflow:hidden;z-index:1;pointer-events:none}
.c-sil{position:absolute;width:76%;right:-6%;top:9%;fill:currentColor;opacity:.2}
.c-sheen{display:none;position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);animation:sheen 3.8s linear infinite}
.card.elite .c-sheen{display:block}
@keyframes sheen{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.c-rating{position:absolute;left:13%;top:7%;z-index:2;display:flex;flex-direction:column;align-items:center;line-height:1}
.c-rating b{font-family:var(--display);font-weight:800;font-size:2.2rem}
.c-rating span{font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.08em;border-top:2px solid var(--line);padding-top:2px;margin-top:2px}
.c-crest{position:relative;margin-top:3px;width:22px;height:22px;border-radius:50%;background:#0A2145;color:#fff;border:2px solid #DA291C;display:grid;place-items:center;font-size:.42rem;font-weight:800;font-style:normal;letter-spacing:0}
.c-name{position:absolute;left:6%;right:6%;top:57%;text-align:center;font-family:var(--display);font-weight:800;font-size:1.1rem;text-transform:uppercase;line-height:1;letter-spacing:.03em;padding-bottom:3px;border-bottom:1px solid var(--line);z-index:2;white-space:nowrap;overflow:hidden;text-overflow:clip}
.c-stats{position:absolute;left:11%;right:11%;top:70%;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:.5rem;font-weight:700;letter-spacing:.1em;z-index:2}
.c-stats b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1;letter-spacing:0}
.c-gain{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#0A2145;color:#fff;border:2px solid var(--t1);border-radius:99px;font-size:.62rem;font-weight:700;padding:0 9px;white-space:nowrap;z-index:5}
.c-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#DA291C;color:#fff;font-size:.6rem;font-weight:800;padding:1px 9px;border-radius:99px;z-index:6;letter-spacing:.06em;border:2px solid #fff}
.card .qty{position:absolute;left:-6px;top:-6px;background:var(--navy);color:#fff;border-radius:999px;font-size:.7rem;padding:0 7px;border:2px solid #fff;z-index:6}
.c-crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:50%}
.c-crest.has-logo{color:transparent;background:none;border-color:transparent}
.c-photo{position:absolute;right:-4%;top:6%;width:80%;height:55%;object-fit:cover;object-position:50% 12%;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.card.has-photo .c-sil{display:none}
.c-name.l2{font-size:.92rem}.c-name.l3{font-size:.8rem}.c-name.l4{font-size:.7rem}
.card.sm{width:96px;height:136px}
.card.sm .c-name.l2{font-size:.76rem}.card.sm .c-name.l3{font-size:.66rem}.card.sm .c-name.l4{font-size:.58rem}
.card.sm .c-rating b{font-size:1.7rem}.card.sm .c-rating span{font-size:.78rem}
.card.sm .c-crest,.card.sm .c-gain{display:none}
.card.sm .c-name{font-size:.88rem;top:57%}
.card.sm .c-stats b{font-size:.95rem}.card.sm .c-stats{font-size:.42rem}
.card.btn-card{cursor:pointer;transition:transform .12s}
.card.btn-card:hover{transform:translateY(-4px)}
.card.used{opacity:.4}
.grid{display:flex;flex-wrap:wrap;gap:20px 14px;margin-top:14px}
.reveal{animation:flip .7s both}
@keyframes flip{from{transform:rotateY(90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .5s both}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.card.glow-or{filter:drop-shadow(0 0 12px rgba(240,200,80,.9))}
.card.glow-elite{filter:drop-shadow(0 0 14px rgba(90,200,255,.95))}
@media (prefers-reduced-motion:reduce){.reveal,.pop,.c-sheen{animation:none!important}}

/* Packs */
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:18px}
.offer{background:var(--navy2);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.offer h3{font-family:var(--display);font-size:1.4rem;font-weight:800}
.pack{width:130px;height:190px;border-radius:8px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 8px;color:#fff;font-family:var(--display);box-shadow:0 8px 18px rgba(0,0,0,.45);overflow:hidden;transition:transform .2s}
.pack::before,.pack::after{content:"";position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 4px,rgba(0,0,0,.25) 4px 8px)}
.pack::before{top:0}.pack::after{bottom:0}
.pk-logo{font-weight:800;font-size:2rem;letter-spacing:.06em}
.pk-star{font-size:3rem;opacity:.9}
.pk-name{font-weight:700;font-size:1.05rem;text-transform:uppercase;text-align:center;line-height:1}
.pk-foot{font-size:.7rem;letter-spacing:.12em;opacity:.9}
.pack.bronze{background:linear-gradient(160deg,#E6B07A,#8A5A2B)}
.pack.argent{background:linear-gradient(160deg,#C9D3E3,#7F8EA3 60%,#3B4660)}
.pack.psg{background:linear-gradient(160deg,#1c4390,#0A2145 55%,#DA291C)}
.offer:hover .pack{transform:translateY(-4px) rotate(-2deg)}
.chips{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.chips span{font-size:.72rem;background:rgba(255,255,255,.1);border-radius:99px;padding:1px 8px}
.card-back{width:124px;height:176px;position:relative;background:var(--red);clip-path:var(--shape);cursor:pointer;transition:transform .15s}
.card-back::before{content:"";position:absolute;inset:3px;background:repeating-linear-gradient(45deg,var(--navy2) 0 10px,var(--navy) 10px 20px);clip-path:var(--shape)}
.card-back span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:3.2rem;font-weight:800;color:var(--red);z-index:1}
.card-back:hover{transform:translateY(-5px)}
.pack-img{width:130px;height:190px;object-fit:contain;transition:transform .2s;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
.offer:hover .pack-img{transform:translateY(-4px) rotate(-2deg)}

/* Index : carte non découverte */
.card-lock{width:124px;height:176px;position:relative;background:rgba(255,255,255,.25);clip-path:var(--shape);flex:none}
.card-lock::before{content:"";position:absolute;inset:3px;background:var(--navy);clip-path:var(--shape)}
.card-lock span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:3.2rem;font-weight:800;color:rgba(255,255,255,.35);z-index:1}
.card-lock small{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:.7rem;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.5);z-index:1}

/* Vente rapide */
.sellbar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.sellitem{display:flex;flex-direction:column;align-items:center;gap:6px;width:136px}
.sellitem .note{text-align:center;font-size:.8rem;margin-top:8px}
.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px}

/* Questions */
.q{font-size:1.25rem;font-weight:600;margin:6px 0 14px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.answers{grid-template-columns:1fr}}
.ans{background:var(--paper);color:var(--navy);border:3px solid transparent;border-radius:10px;padding:12px;font-weight:600;text-align:left;font-size:1rem}
.ans:hover:not(:disabled){border-color:var(--red)}
.ans.ok{background:#2fa35c;color:#fff}
.ans.ko{background:#c33;color:#fff}
.meter{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.meter i{display:block;height:100%;background:var(--red)}
.note{opacity:.8;font-size:.92rem}

/* Duel */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:12px 0;justify-items:center}
.vs .mid{font-family:var(--display);font-size:1.4rem;text-align:center}
.vs .win .card{filter:drop-shadow(0 0 3px var(--gold)) drop-shadow(0 0 10px var(--gold))}
.result{font-family:var(--display);font-size:2.2rem;font-weight:800;margin-top:10px}
#qBox,#quizBox{display:block;margin-bottom:30px}
input[type=number],input[type=text]{background:var(--paper);color:var(--navy);border:3px solid transparent;border-radius:10px;padding:10px 12px;font-size:1.05rem;font-family:inherit;width:150px}
input[type=text]{width:100%;max-width:320px}

/* Pseudo + toast */
.overlay{position:fixed;inset:0;background:rgba(5,15,35,.92);display:grid;place-items:center;z-index:50;padding:20px;overflow:auto}
.overlay[hidden]{display:none}
.overlay .box{background:var(--navy2);border-radius:16px;padding:26px;max-width:420px;width:100%}
.gift{display:flex;justify-content:center;margin:16px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--navy);font-weight:600;padding:10px 20px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
</style>
</head>

function short(n){

  if(a>=1e9)return f(n/1e9,'Md');
  if(a>=1e6)return f(n/1e6,'M');
  if(a>=1e4)return f(n/1e3,'k');
  return n.toLocaleString('fr-FR',{maximumFractionDigits:2});
}

/* ---------- Sauvegarde ---------- */
const SAVE='mdt_psg_v2'; // v2 : nouveau catalogue de joueurs (anciennes sauvegardes ignorées)
let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(SAVE));if(r&&Array.isArray(r.team)){
    // Retire des places les joueurs mal positionnés (ils restent dans la collection)
    // (et les doublons : un même joueur ne peut être placé qu'une fois)
    // Passage à l'échelle du million : l'argent d'une ancienne sauvegarde est converti, une seule fois
    if(!r.mil){r.money=Math.round((r.money||0)*M);r.acc=0;r.mil=1;}
    // Migration v3 : les gardiens sont supprimés et les numéros de cartes ont changé -> on replace tout par le nom
    if(!r.v){
      const OLD=['Matvey Safonov','Lucas Chevalier','Alessandro Longoni','Achraf Hakimi','Marquinhos','Willian Pacho','Illia Zabarnyi','Lucas Beraldo','David Boly','Axel Koukaba','Lucas Hernández','Lucas Digne','Nuno Mendes','Vitinha','João Neves','Fabián Ruiz','Warren Zaïre-Emery','Senny Mayulu','Dro Fernández','Adam Mouak','Maghnes Akliouche','Quentin Ndjantou','Ousmane Dembélé','Désiré Doué','Khvicha Kvaratskhelia','Ferran Torres','Mika Godts'];
      const REFUND={'Matvey Safonov':30,'Lucas Chevalier':12.5,'Alessandro Longoni':7.5}; // en M € : les gardiens sont remboursés
      const nid=n=>P.findIndex(p=>p.name===n);
      const no={};
      Object.keys(r.owned||{}).forEach(k=>{
        const n=OLD[k],qty=r.owned[k];
        if(!n||!(qty>0))return;
        const i=nid(n);
        if(i>=0)no[i]=(no[i]||0)+qty;
        else r.money=(r.money||0)+Math.round((REFUND[n]||0)*M*qty);
      });
      r.owned=no;
      r.team=r.team.map(id=>{const i=id==null?-1:nid(OLD[id]);return i>=0?i:null;});
      r.v=3;
    }
    // Retire de la collection les cartes qui n'existent plus (anciens joueurs et légendes désactivés)
    r.owned=r.owned||{};
    Object.keys(r.owned).forEach(k=>{if(!P[k])delete r.owned[k];});
    // Ancienne formation (6 places) -> 4-3-3 : chaque joueur est replacé à son poste
    const seen=new Set();
    const nt=SLOTS.map(()=>null);
    r.team.forEach(id=>{
      if(id==null||!P[id]||seen.has(id))return;
      const i=SLOTS.findIndex((g,k)=>g===GROUP[P[id].pos]&&nt[k]===null);
      if(i>=0){nt[i]=id;seen.add(id);}
    });
    r.team=nt;
    return r;}}catch(e){}
  return {name:'',money:0,owned:{},team:SLOTS.map(()=>null),upg:0,gift:false,mil:1,v:3};
}
let RESET=false; // bloque toute sauvegarde pendant la remise à zéro

function resetGame(){
  if(!confirm('Recommencer le jeu ? Ton argent, tes cartes et ta base seront définitivement effacés.'))return;
  RESET=true;
  try{localStorage.removeItem(SAVE);}catch(e){}
  location.reload();
}

/* Revenus automatiques : crédités aussi hors-ligne (plafond OFFLINE_CAP, à OFFLINE_RATE du revenu) */
function tick(){
  const now=Date.now();
  let dt=(now-(S.last||now))/1000;
  S.last=now;
  if(!(dt>0))return;
  const offline=dt>OFFLINE_MIN;
  dt=Math.min(dt,OFFLINE_CAP);
  const gain=totalGps()*dt*(offline?OFFLINE_RATE:1);
  S.acc=(S.acc||0)+gain;
  const whole=Math.floor(S.acc);
  if(whole>0){S.acc-=whole;S.money+=whole;}
  save();renderHeader();
  if(offline&&gain>=1)toast('Pendant ton absence : +'+eur(gain));
}
setInterval(tick,1000);

  const g=GROUP[P[id].pos];

/* ---------- Pack de départ (gratuit : 8 cartes tirées au hasard, très grosse chance de Bronze) ---------- */
const STARTER_N=8;
const STARTER_W={bronze:90,argent:9,or:1}; // chances en % par carte (pas d'Élite dans le cadeau)
function giveStarter(){
  const cards=Array.from({length:STARTER_N},()=>drawCard(STARTER_W));
  cards.forEach(p=>{
    S.owned[p.id]=(S.owned[p.id]||0)+1;
    // Placée sur le terrain si une place libre existe à son poste et si elle n'y est pas déjà
    const i=usedCount(p.id)>0?-1:SLOTS.findIndex((sl,k)=>sl===GROUP[p.pos]&&S.team[k]===null);
    if(i>=0)S.team[i]=p.id;
  });
  S.gift=true;save();
  return cards;
}

/* Packs : pour mettre ton propre dessin, remplis img avec un chemin ('packs/recrue.png') ou un lien.
   Laisse '' pour garder le dessin par défaut. Les prix se changent avec price. */
const PACKS=[
  // n = nombre de cartes dans le pack, w = chances par rareté (en %)
  {id:'bronze',name:'Pack Recrue',price:40*M,img:'',n:3,w:{bronze:100},desc:'3 joueurs Bronze garantis.'},

function drawCard(w){
  const total=Object.values(w).reduce((a,b)=>a+b,0);
  let r=Math.random()*total,rar=Object.keys(w)[0];
  for(const k in w){if(r<w[k]){rar=k;break;}r-=w[k];}
  return rand(OBTAINABLE.filter(p=>p.rar===rar));
}
function packHTML(k){
  if(k.img)return `<img class="pack-img" src="${esc(k.img)}" alt="${esc(k.name)}">`;
  return `<div class="pack ${k.id}"><div class="pk-logo">PSG</div><div class="pk-star">★</div><div class="pk-name">${esc(k.name)}</div><div class="pk-foot">${k.n} JOUEUR${k.n>1?'S':''}</div></div>`;
}

    <div class="packs">${PACKS.map(k=>`<div class="offer">

      <div class="chips">${Object.keys(k.w).map(r=>`<span>${RAR_LABEL[r]} ${k.w[r]} %</span>`).join('')}</div>
      <button class="btn" data-pack="${k.id}" data-price="${k.price}" ${S.money<k.price?'disabled':''}>Ouvrir · ${eur(k.price)}</button>

    </div>`).join('')}</div>`;
  document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{
    const k=PACKS.find(x=>x.id===b.dataset.pack);
    if(S.money<k.price)return;
    S.money-=k.price;
    const cards=Array.from({length:k.n},()=>{

      return {p,isNew,revealed:false};

    opening={pack:k,cards};

  });
  document.querySelectorAll('[data-r]').forEach(c=>{
    const go=()=>{opening.cards[+c.dataset.r].revealed=true;renderShop();};
    c.onclick=go;c.onkeydown=e=>{if(e.key==='Enter')go();};
  });
  const ra=$('#revealAll');if(ra)ra.onclick=()=>{opening.cards.forEach(c=>c.revealed=true);renderShop();};

}

/* ---------- Duel Fatal (4-3-3 : 5 manches, un poste tiré à chaque manche, n'importe quel joueur peut jouer) ---------- */
let duel=null;
const DUEL_ROUNDS=5;
const DUEL_POSTS=['ATT','MIL','DEF'];
const DUEL_STAT={ATT:'att',MIL:'mil',DEF:'def'};
const DUEL_LABEL={ATT:'Attaquant',MIL:'Milieu',DEF:'Défenseur'};
const DUEL_NEED={ATT:3,MIL:3,DEF:4}; // équipe du rival : 4-3-3
const RIVAL_SMART=0.7; // chance que le rival joue son meilleur joueur disponible sur la stat tirée (sinon il joue au hasard)
const teamFull=()=>S.team.every(id=>id!==null);
const sample=(a,n)=>shuffle(a).slice(0,n);
function renderDuel(){
  const ready=teamFull();
  const inGame=duel&&!duel.over;
  let body=`<h2>Duel Fatal</h2>
    <p class="sub">5 manches. À chaque manche, un poste est tiré au sort : défenseur, milieu ou attaquant. Tu choisis n'importe lequel de tes joueurs, même s'il n'est pas de ce poste : seule compte sa stat du poste tiré (DEF, MIL ou ATT). Le rival fait de même. Un joueur ne peut servir qu'une fois par duel. Tu mises, le rival mise autant, le vainqueur prend toute la cagnotte.</p>`;
  if(!inGame){
    body+=`<div class="panel">`;
    if(!ready){
      body+=`<p>Il te faut tes 10 joueurs sur le terrain (3 attaquants, 3 milieux, 4 défenseurs). Va dans <b>Ma base</b> pour composer ton équipe.</p>`;
    }else{
      body+=`<div class="row">
        <label for="bet">Ta mise</label>
        <input type="number" id="bet" min="1" max="${Math.max(S.money,1)}" value="${Math.min(10,Math.max(S.money,1))}">
        <button class="btn alt" data-q="0.25">¼</button><button class="btn alt" data-q="0.5">½</button><button class="btn alt" data-q="1">Tout</button>
        <button class="btn" id="fight" ${S.money<1?'disabled':''}>Lancer le duel</button></div>
        <p class="note" style="margin-top:8px">Cagnotte en jeu : ta mise + celle du rival. En cas d'égalité, chacun récupère sa mise. La mise est prélevée dès le début du duel.</p>`;
    }
    body+=`</div>`;
  }
  body+=`<div id="arena"></div>`;
  $('#main').innerHTML=body;
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#bet').value=Math.max(1,Math.floor(S.money*+b.dataset.q));});
  const f=$('#fight');if(f)f.onclick=startDuel;
  drawArena();
}
function startDuel(){
  const bet=Math.floor(+$('#bet').value);
  if(!(bet>=1)||bet>S.money){toast('Mise invalide : entre 1 € et ton solde.');return;}
  const mine=S.team.map(id=>P[id]);
  const avg=mine.reduce((a,p)=>a+p.ovr,0)/mine.length;
  // Équipe du rival : 3 attaquants, 3 milieux, 4 défenseurs de niveau proche du tien
  const opp=[];
  ['ATT','MIL','DEF'].forEach(g=>{
    const all=OBTAINABLE.filter(p=>GROUP[p.pos]===g);
    let pick=sample(all.filter(p=>Math.abs(p.ovr-avg)<=6),DUEL_NEED[g]);
    if(pick.length<DUEL_NEED[g])pick=pick.concat(sample(all.filter(p=>!pick.includes(p)),DUEL_NEED[g]-pick.length));
    while(pick.length<DUEL_NEED[g])pick.push(rand(all));
    opp.push(...pick);
  });
  // 5 postes tirés au sort (un même poste peut sortir plusieurs fois)
  const posts=Array.from({length:DUEL_ROUNDS},()=>rand(DUEL_POSTS));
  // La mise est prélevée tout de suite (pas de triche en rechargeant la page)
  S.money-=bet;save();renderHeader();
  duel={mine,opp,posts,bet,round:0,rounds:[],usedMine:new Set(),usedOpp:new Set(),score:0,oscore:0,phase:'pick',over:false,out:null};
  renderDuel();
}
function pickDuel(id){
  const d=duel;if(!d||d.phase!=='pick'||d.usedMine.has(id))return;
  const post=d.posts[d.round],k=DUEL_STAT[post];
  const me=P[id];
  // Le rival choisit parmi ses joueurs encore disponibles
  const cand=d.opp.filter(p=>!d.usedOpp.has(p.id));
  const best=cand.reduce((m,p)=>p[k]>m[k]?p:m,cand[0]);
  const rv=Math.random()<RIVAL_SMART?best:rand(cand);
  d.usedMine.add(id);d.usedOpp.add(rv.id);
  const a=me[k],b=rv[k];
  const w=a>b?1:a<b?-1:0;
  if(w===1)d.score++;else if(w===-1)d.oscore++;
  d.rounds.push({post,k:k.toUpperCase(),me,rv,a,b,w});
  d.phase='result';
  renderDuel();
}
function nextDuel(){
  const d=duel;if(!d)return;
  d.round++;
  if(d.round>=DUEL_ROUNDS){
    d.over=true;d.phase='end';
    d.out=d.score>d.oscore?'win':d.score<d.oscore?'lose':'draw';
    if(d.out==='win')S.money+=2*d.bet;else if(d.out==='draw')S.money+=d.bet;
    save();renderHeader();
  }else d.phase='pick';
  renderDuel();
}
function drawArena(){
  const d=duel,a=$('#arena');if(!a||!d)return;
  let html='';
  d.rounds.forEach((r,i)=>{
    html+=`<div class="vs">
      <div class="${r.w===1?'win':''}">${cardHTML(r.me,{sm:true})}</div>
      <div class="mid">Manche ${i+1}<br>${DUEL_LABEL[r.post]} · <b>${r.k}</b><br>${r.a} – ${r.b}<br>${r.w===1?'Point pour toi':r.w===-1?'Point pour le rival':'Égalité'}</div>
      <div class="${r.w===-1?'win':''}">${cardHTML(r.rv,{sm:true})}</div></div>`;
  });
  if(!d.over){
    if(d.phase==='pick'){
      const post=d.posts[d.round],k=DUEL_STAT[post];
      const choices=d.mine.filter(p=>!d.usedMine.has(p.id)).sort((x,y)=>y[k]-x[k]);
      html+=`<div class="panel">
        <h2 style="font-size:1.5rem">Manche ${d.round+1} / ${DUEL_ROUNDS} · Score ${d.score} – ${d.oscore}</h2>
        <p>Poste tiré : <b>${DUEL_LABEL[post]}</b>. Choisis n'importe quel joueur : c'est sa stat <b>${k.toUpperCase()}</b> qui compte (classés de la plus haute à la plus basse).</p>
        <div class="grid">${choices.map(p=>cardHTML(p,{cls:'btn-card',attrs:`data-duel="${p.id}" tabindex="0" role="button"`})).join('')}</div></div>`;
    }else{
      html+=`<div class="panel"><p style="margin-bottom:12px">Score : ${d.score} – ${d.oscore}</p><button class="btn" id="nextD">${d.round===DUEL_ROUNDS-1?'Voir le résultat':'Manche suivante'}</button></div>`;
    }
  }else{
    const msg={win:`Victoire ${d.score}–${d.oscore} ! Tu gagnes ${eur(d.bet)}.`,lose:`Défaite ${d.score}–${d.oscore}. Tu perds ${eur(d.bet)}.`,draw:`Égalité ${d.score}–${d.oscore}. Tu gardes ta mise.`}[d.out];
    html+=`<div class="panel"><p class="result">${msg}</p><div style="margin-top:12px"><button class="btn" id="rematch">Nouveau duel</button></div></div>`;
  }
  a.innerHTML=html;
  document.querySelectorAll('[data-duel]').forEach(c=>{c.onclick=()=>pickDuel(+c.dataset.duel);c.onkeydown=e=>{if(e.key==='Enter')c.click();};});
  const n=$('#nextD');if(n)n.onclick=nextDuel;
  const rm=$('#rematch');if(rm)rm.onclick=()=>{duel=null;renderDuel();};
}

/* ---------- Accueil : pseudo puis pack de bienvenue ---------- */
function showNameStep(){
  $('#gateBox').innerHTML=`<h2>Bienvenue au Parc</h2>
    <p class="sub">Choisis ton pseudo : il s'affichera sur le panneau de ta base.</p>
    <form id="nameForm" class="row">
      <input type="text" id="nameInput" maxlength="16" placeholder="Ton pseudo" autocomplete="off" required>
      <button class="btn" type="submit">Continuer</button>
    </form>`;
  $('#nameGate').hidden=false;
  $('#nameInput').focus();
  $('#nameForm').onsubmit=e=>{
    e.preventDefault();
    const v=$('#nameInput').value.trim();
    if(!v)return;
    S.name=v;save();
    showGiftStep();
  };
}
function showGiftStep(){
  const cards=S.gift?[]:giveStarter();
  $('#gateBox').innerHTML=`<h2>Pack de départ offert</h2>
    <p class="sub">Le club t'offre 8 joueurs tirés au hasard pour démarrer. Ceux qui ont une place libre sont déjà sur ton terrain, et ce sont eux qui te rapportent des €. Les autres vont dans ta collection. Gagne de l'argent pour recruter mieux !</p>
    <div class="grid" style="justify-content:center">${cards.map((c,i)=>cardHTML(c,{sm:true,cls:'reveal',attrs:`style="animation-delay:${i*.12}s"`})).join('')}</div>
    <p style="margin-top:16px"><button class="btn" id="startBtn">Entrer dans ma base</button></p>`;
  $('#startBtn').onclick=()=>{$('#nameGate').hidden=true;render();};
  $('#nameGate').hidden=false;
}
$('#resetBtn').onclick=resetGame;
tick(); // crédite les gains accumulés pendant l'absence
if(!S.name){showNameStep();}
else if(!S.gift){showGiftStep();}
render();
</script>
